name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build every mode
        run: python -m aoe2modes build --all

      - name: Upload scenarios
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: dist/*.aoe2scenario
          if-no-files-found: error
