[civilization_leaders]
enabled = true
# A separate per-civilization unit definition keeps every placed leader reference
# intact, without changing the ordinary hero units unlocked later in the match.
unit_id = 2750

# All commanders use native bows, crossbows or firearms with the same starting
# combat envelope. The original eight-second HP/attack growth is unchanged.
[civilization_leaders.profiles.ranged]
hit_points = 300
attack = 25
reload_seconds = 2.0
melee_armour = 2
pierce_armour = 2
range = 5.0
speed = 1.4
accuracy_percent = 100

[civilization_leaders.profiles.ranged_cavalry]
hit_points = 300
attack = 25
reload_seconds = 2.0
melee_armour = 2
pierce_armour = 2
range = 5.0
speed = 1.4
accuracy_percent = 100
