[mode]
id = "evolution_alpha"
name = "CBA Hero Ascendants"
version = "1.0.4"
description = "A complete CBA Hero arena with automatic armies, six hero tiers, free building and research, protected team routes, live K/D/R, center rewards, and team vote-kicks."
authors = []
tags = ["cba", "hero", "arena", "4v4"]

[scenario]
# No `base`: this mode is built from code in generated/, starting from a blank
# scenario. `reference` is the original it was decompiled from. The final public
# build intentionally differs; use `make check-ascendants` for both verification layers.
reference = "base.aoe2scenario"
version = "1.58"
filename = "{name} v{version}"

# Applied before build.py, then overridden by generated/setup.py. Kept in sync so
# `aoe2modes info` tells the truth about the mode.
[map]
size = 144
terrain = "GRASS_1"

[players]
count = 8
teams = [[1, 2, 3, 4], [5, 6, 7, 8]]
starting_age = "FEUDAL_AGE"
population_cap = 250

[xs]
include = []
scripts = []
